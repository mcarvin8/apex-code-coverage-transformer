# Smoke test for the programmatic API (`import { transformCoverage } from
# 'apex-code-coverage-transformer'`), run as an external consumer in a scratch
# project: published types must compile and the runtime checks must pass.
# Runs for both npm packages built from this repo: the CLI plugin package and the
# dependency-free apex-code-coverage-transformer-core. See scripts/api-consumer/.
#
# Two sources, deliberately not the same:
# - pull_request: installs an `npm pack` tarball of this checkout - catches a
#   broken exports map, missing .d.ts or API regression before merge.
# - workflow_call (from release.yml) / workflow_dispatch: installs the exact
#   version from the npm registry - checks what users actually get.
name: Smoke test (programmatic API)

on:
  pull_request:
    paths:
      - '.github/workflows/smoke-test-api.yml'
      - 'scripts/api-consumer/**'
      - 'package.json'
      - 'packages/core/**'
      - 'tsconfig.core.json'
      - 'scripts/verify-core-package.mjs'
      - 'src/index.ts'
      - 'src/transformers/**'
      - 'src/utils/**'
      - 'src/handlers/**'
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to test (defaults to the version in package.json)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  api-consumer:
    name: API consumer (${{ matrix.package }}, ${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [apex-code-coverage-transformer, apex-code-coverage-transformer-core]
        os: [ubuntu-latest, windows-latest]
        # Current LTS, plus the lowest Node each package supports (its package.json engines):
        # the plugin needs more than core because of sfdx-hardis.
        node-version: ['lts/*']
        include:
          - { package: apex-code-coverage-transformer, os: ubuntu-latest, node-version: '22.22.2' }
          - { package: apex-code-coverage-transformer, os: windows-latest, node-version: '22.22.2' }
          - { package: apex-code-coverage-transformer-core, os: ubuntu-latest, node-version: '22.19.0' }
          - { package: apex-code-coverage-transformer-core, os: windows-latest, node-version: '22.19.0' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pack this checkout
        if: github.event_name == 'pull_request'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          npm ci
          npm run build
          # --ignore-scripts skips prepack (oclif manifest/readme for the plugin, a rebuild for
          # core); `npm run build` above already built both packages.
          PACK_DIR="$RUNNER_TEMP/pack"
          mkdir -p "$PACK_DIR"
          if [ "$PACKAGE" = "apex-code-coverage-transformer-core" ]; then
            npm pack ./packages/core --ignore-scripts --pack-destination "$PACK_DIR"
          else
            npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          fi
          echo "PACKAGE_SPEC=$(ls "$PACK_DIR"/*.tgz)" >> "$GITHUB_ENV"

      - name: Use published version
        if: github.event_name != 'pull_request'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PACKAGE: ${{ matrix.package }}
        run: |
          VERSION="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          echo "PACKAGE_SPEC=$PACKAGE@$VERSION" >> "$GITHUB_ENV"

      - name: Run consumer checks
        run: scripts/api-consumer/run.sh "$PACKAGE_SPEC"
