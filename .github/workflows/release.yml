name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  # Keeps dist/action/index.cjs current on every push to main, independent of
  # whether this push is an actual release. A contributor's PR should already
  # include a fresh bundle (enforced by test.yml's lint job), but this is the
  # safety net: it ensures main is never stale by the time a maintainer merges
  # the pending release-please PR, so release-please's own version tag (not
  # just the floating major tag moved below) always includes a correct bundle.
  # Race-free with release-please as long as maintainers let this job finish
  # (and its commit, if any, land) before merging that PR - the release-please
  # PR itself only touches version/changelog files, never src/, so it can't
  # race with a bundle rebuild triggered by its own merge.
  rebuild-dist:
    name: Keep dist/action fresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Action bundle
        run: npm run build:action

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: rebuild Action bundle [skip ci]"
          file_pattern: 'dist/action/**'

  unit-tests:
    name: Unit Tests (ubuntu-latest, node LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        env:
          SF_DISABLE_TELEMETRY: true

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Publish to NPM
        id: publish
        run: |
          NODE_AUTH_TOKEN="" npm publish --access public --tag latest --provenance
          echo "published=true" >> "$GITHUB_OUTPUT"

      # `npm publish` runs the `prepack` script (oclif manifest && oclif readme),
      # which regenerates README.md's Command Reference against the version
      # release-please just bumped. Push that back to main so the repo's README
      # never drifts from what was just published. This must run BEFORE the tag
      # move below: it leaves README.md modified but uncommitted in the working
      # tree, and the repo's husky pre-push hook checks README.md is committed
      # on every push (including a tag push) - pushing the tag first fails it.
      - name: Commit regenerated README
        if: steps.publish.outputs.published == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: regenerate command reference [skip ci]"
          file_pattern: README.md

      # Moves a floating major-version tag (e.g. v3) to the release commit so
      # GitHub Action consumers can pin `uses: mcarvin8/apex-code-coverage-transformer@v3`
      # instead of an exact patch version.
      - name: Move floating major version tag
        if: steps.publish.outputs.published == 'true'
        run: |
          MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force

  smoke-test:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit
